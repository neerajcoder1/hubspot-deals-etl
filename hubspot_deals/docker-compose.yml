version: '3.8'

services:
  api:
    build: .
    ports:
      - "${PORT:-5200}:5200"
    environment:
      - ENV=${ENV:-development}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=hubspot_data
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - HUBSPOT_ACCESS_TOKEN=${HUBSPOT_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=hubspot_data
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hubspot_data"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: